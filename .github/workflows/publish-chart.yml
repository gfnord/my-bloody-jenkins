name: publish-chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version (without leading v)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve chart version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Validate dispatch input is a bare semver (no shell metachars)
            if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$'; then
              echo "Invalid version: $INPUT_VERSION"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            # Strip leading 'v' from git tag → chart semver
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # appVersion aligned with LTS_VERSION.txt
          APPVERSION="$(cat LTS_VERSION.txt)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "appversion=${APPVERSION}" >> "$GITHUB_OUTPUT"

      - name: Set chart version
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
          APP_VERSION: ${{ steps.ver.outputs.appversion }}
        run: |
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" chart/Chart.yaml
          cat chart/Chart.yaml

      - name: Lint chart
        run: helm lint chart/

      - name: Package chart
        run: |
          mkdir -p packaged
          helm package chart/ --destination packaged/

      - name: Push chart to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          for pkg in packaged/*.tgz; do
            helm push "$pkg" oci://ghcr.io/${REPO_OWNER}/charts
          done
